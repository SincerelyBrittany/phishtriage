[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishtriage"
version = "0.1.0"
description = "Analyze a suspicious email and tell you whether it's phishing, why, and what to do next."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "responses>=0.25"]

[project.scripts]
phishtriage = "phishtriage.cli:app"

[tool.setuptools.packages.find]
include = ["phishtriage*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Typer declares options as argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
